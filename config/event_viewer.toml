# MC energy and graph viewer.
[samples]
bb0nu = "events/0nubb_hitdf.h5"
bb0nu_100um = "events/0nubb_100um_hitdf.h5"
electrons = "events/electron_0nubb_energy_hitdf.h5"

[display]
nbins = 100
extent_scale = 2.0
colormap = "viridis"
colour_scale = "linear"
voxel_opacity = 1.0
auto_rotate = false

[mc_graph]
voxel_width_mm = 0.5
method = "KDT"
distance_mode = "voxel_multiple"
distance_voxel_multiple = 2.5
max_distance_mm = 1.25
energy_threshold_keV = 1.0
k = 10

[session]
file_directory = "events"
initial_sample = "bb0nu"
restore = true
work_dir = "work/event_viewer"

[server]
host = "127.0.0.1"
port = 0
open_browser = true

[transport]
detector_card = "config/detector.toml"
ionisation_energy_eV = 21.9
min_cm = 10.0
max_cm = 150.0
fixed_cm = 80.0
mode = "random"
nbins = 100
nsigma = 3.0
seed = 2026

[pads]
z_bin_width_mm = 2.0
minimum_xy_span_mm = 160.0
drift_direction = 1

# Gas: xenon enriched in Xe-136 with 15.8 % helium (mole fraction), and the
# density model. User design input, 2026-11-17: the helium fraction of the
# NEXT-DEMO++ measurement (papers/xehe_paper.pdf) whose transport and EL yield
# are used in drift.toml and el.toml.
schema = "nausicaa.eitaca_gas.v1"
mixture = "Xe_84p2_He_15p8"
helium_mole_fraction = 0.158
xenon_enrichment = "GXeEnriched"       # NEXUS materials::GXeEnriched, isotopic fractions below
xenon_isotopic_fractions = { Xe129 = 0.000656392, Xe130 = 0.000656392, Xe131 = 0.00234361, Xe132 = 0.00708251, Xe134 = 0.086645, Xe136 = 0.902616 }
temperature_K = 290.0
pressure_bar = 16.0

[density_model]
# NEXT DocDB 1183, as in simulation/nexus/source/geometries/ItacaChamber.cc.
# Xenon: second-virial compressibility z = 1 + (a - b / T_r^1.6) P_r / T_r,
# T_r = T / T_c, P_r = P / P_c. Helium: ideal gas. Mixture: additive partial volumes.
xenon_virial_a = 0.083
xenon_virial_b = 0.422
xenon_critical_temperature_K = 289.733
xenon_critical_pressure_bar = 58.420
helium = "ideal"
mixing_rule = "additive_partial_volumes"

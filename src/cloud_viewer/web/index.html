<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAUSICAA · Paired diffusion clouds</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/plotly.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">NAUSICAA / EVENT VIEWER II</span><h1>Paired diffusion clouds</h1></div>
    <div class="controls">
      <button id="previous" title="Previous event (←)">← Previous</button>
      <label for="event">Event number</label>
      <input id="event" type="number" min="0" value="0" step="1">
      <button id="go">Go</button>
      <button id="next" title="Next event (→)">Next →</button>
      <span id="counter"></span>
    </div>
  </header>
  <div id="status" role="status">Loading event…</div>
  <main id="board"></main>
  <footer>Colour represents carriers per display cell. The rotatable 3D view groups 4 × 4 × 4 saved cells; all counts are retained.</footer>
</body>
</html>

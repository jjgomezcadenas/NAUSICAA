[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nausicaa-ion-signal"
version = "0.1.0"
description = "Reproducible positive-ion transport and induced-current benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
viewer = ["h5py>=3.16,<4", "plotly==6.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

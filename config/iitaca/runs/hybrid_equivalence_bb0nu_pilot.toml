# Check of the iItaca chain against the ITACA production: the bb0nu pilot of
# 10 x 100 events read with the ion settings of bb0nu_itaca_pilot_10x100_ion15
# (config/runs/). The iItaca chain must give the same itrack hits
# (tests/iitaca/test_iitaca_equivalence.jl). The NEXUS files are Xe/He at
# 16 bar in a chamber of 1.8 m radius and 1.3 m length.
schema = "nausicaa.iitaca_run.v1"
detector = "config/iitaca/iitaca.toml"
run_label = "hybrid_equivalence_bb0nu_pilot"
sample = "bb0nu"
hits = "$NAUSICAA_DATA/pilot_10x100/bb0nu/bb0nu_{batch}_hitdf.h5"
particles = "$NAUSICAA_DATA/pilot_10x100/bb0nu/bb0nu_{batch}.next.h5"
generated_events_per_batch = 100
max_events = 0                    # 0: all events of the batch
seed = 42
electronics_seed = 20261113
frame_track = "primary_and_delta_electrons"
max_vector_bytes = 268435456
vh1_minimum_samples = 32768

[overrides]
"gas.mixture" = "Xe_85_He_15"
"gas.helium_mole_fraction" = 0.15
"geometry.fiducial_diameter_cm" = 360.0
"geometry.fiducial_length_cm" = 130.0
"drift.field_V_cm" = 350.0
"drift.ion_drift_velocity_cm_s" = 15.0
"ions.frame_ms" = 20.0
"ions.vh1_card" = "config/specs/response/ion_csa/vh1_device_changes_cf20f.toml"

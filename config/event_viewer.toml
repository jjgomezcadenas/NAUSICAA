# MC energy viewer. Graph settings are reserved for the next implementation step.
[samples]
bb0nu = "events/0nubb_hitdf.h5"
electrons = "events/electron_0nubb_energy_hitdf.h5"

[display]
nbins = 100
extent_scale = 1.3
colormap = "viridis"
colour_scale = "linear"
voxel_opacity = 1.0
auto_rotate = false

[mc_graph]
voxel_width_mm = 0.5
method = "KDT"
distance_mode = "voxel_multiple"
distance_voxel_multiple = 2.5
max_distance_mm = 1.25
energy_threshold_keV = 1.0
k = 10

[session]
initial_sample = "bb0nu"
restore = true
work_dir = "work/event_viewer"

[server]
host = "127.0.0.1"
port = 0
open_browser = true

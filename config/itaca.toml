# ITACA detector and operating conditions. One source for the gas, the
# fiducial geometry, the drift and EL regions, the ion collection stack and
# the energy constants. The ELM dimensions are in [elm]. The ion pad pitch
# is not here: the run and detector cards under config/ select it.
#
# Every value has an entry in [source], keyed "section.key". All values are
# confirmed design inputs (user, 2026-11-15). Derived quantities (densities,
# masses, reduced fields, yields, potentials, drift times) are computed by
# scripts/documentation/calculate_itaca_conditions.jl, not stored here.
# Page: notes/html/itaca_detector.html.

schema = "nausicaa.itaca_conditions.v1"
date = "2026-11-15"

[gas]
mixture = "Xe_85_He_15"
helium_mole_fraction = 0.15
xenon_enrichment = "GXeEnriched"       # NEXUS isotopic abundances, below
xe136_isotopic_fraction = 0.902616
xenon_isotopic_fractions = { Xe129 = 0.000656392, Xe130 = 0.000656392, Xe131 = 0.00234361, Xe132 = 0.00708251, Xe134 = 0.086645, Xe136 = 0.902616 }
temperature_K = 290.0
pressure_bar = 16.0

[gas.density_model]
# Xenon: second-virial compressibility z = 1 + (a - b / T_r^1.6) P_r / T_r,
# T_r = T / T_c, P_r = P / P_c. Helium: ideal gas. Mixture: additive partial
# volumes (Amagat) for mole fractions x_xe, x_he:
#   rho = P (x_xe M_xe + x_he M_he) / ((x_xe z_xe + x_he) R T).
xenon_virial_a = 0.083
xenon_virial_b = 0.422
xenon_critical_temperature_K = 289.733
xenon_critical_pressure_bar = 58.420
helium = "ideal"
mixing_rule = "additive_partial_volumes"

[geometry]
fiducial_diameter_cm = 360.0
fiducial_length_cm = 130.0

[drift]
field_V_cm = 350.0
electron_lifetime_ms = 100.0
# Magboltz, Xe/He 85/15, 16 bar, 290 K, 350 V/cm, real-gas density.
electron_drift_velocity_mm_us = 0.5684
electron_drift_velocity_relative_error = 0.0267
electron_transverse_diffusion_mm_sqrtm = 2.0115
electron_transverse_diffusion_relative_error = 0.0246
electron_longitudinal_diffusion_mm_sqrtm = 3.4227
electron_longitudinal_diffusion_relative_error = 0.0461
# The same two coefficients in the units of the production cards,
# D[mm sqrt(bar)/sqrt(cm)] = D[mm/sqrt(m)] sqrt(P[bar]) / 10.
electron_transverse_diffusion_mm_sqrtbar_sqrtcm = 0.8046
electron_longitudinal_diffusion_mm_sqrtbar_sqrtcm = 1.3691
# Ions: literature mobility, not a Magboltz result.
ion_drift_velocity_cm_s = 16.5
ion_species = "Xe2+ molecular ion, charge +e"

[el]
depth_mm = 5.0
voltage_kV = 15.0
sipm_plane_V = 0.0
# Yield model: photons per electron = gain x (V_EL[kV] - threshold x P[bar] x d[cm]).
yield_gain_photons_per_electron_kV = 139.0
yield_threshold_kV_cm_bar = 0.80
variance_ratio_J = 0.030

[elm]
# Electroluminescent module: holes, transfer gap, light guides and SiPMs.
hole_pitch_mm = 4.0
hole_diameter_mm = 2.5
transfer_gap_mm = 10.0
transfer_gap_field_V_cm = 300.0
guide_length_mm = 100.0
guide_length_policy = "fixed_length"
# Average gradient from the EL exit electrode (68.8 kV) to the SiPM plane.
grading_field_kV_cm = 6.88
guide_refractive_index = 1.5
gas_gap_radial_mm = 0.5
sipm_side_mm = 3.0
tpb_conversion_efficiency = 0.65
forward_fraction = 0.5

[ion_readout]
# Potentials of the ion collection stack; pads and SiPM plane at ground.
tpc_face_ifg_V = 8000.0
pad_face_ifg_V = 3000.0
pads_V = 0.0
ifg_thickness_mm = 10.0
pad_gap_mm = 5.0

[energy]
W_eV = 21.9
fano_factor = 0.15


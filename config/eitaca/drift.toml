# Drift region: field and electron transport.
schema = "nausicaa.eitaca_drift.v1"
field_V_cm = 400.0                  # 25 V/cm/bar at 16 bar
electron_lifetime_ms = 100.0
# NEXT-DEMO++, papers/xehe_paper.pdf, Table 1, 15.8 % He, E/p = 25 V/cm/bar

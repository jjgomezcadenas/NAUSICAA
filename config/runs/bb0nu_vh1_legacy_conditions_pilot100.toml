# Pilot of the new configuration: the default ITACA detector overridden to the
# conditions of the current production (config/readout/
# bb0nu_detector_response_3mm_mainframe20.toml: 15 bar, 293.15 K, 150 cm,
# 300 V/cm, 0.6 mm/us, 30 ms, diffusion 1.6 / 0.75 in card units, 15 cm/s).
# Its events must reproduce, one by one, the detector response and the hits of
# results/readout/bb0nu_full_ion3mm_20ms_el4mm_mainframe20mm_XeHe15_E300_tau30_seed42.
schema = "nausicaa.run.v1"
detector = "config/detector/itaca.toml"
run_label = "bb0nu_newconfig_legacy_conditions_pilot100"
sample = "bb0nu"
hits = "events/0nubb_hitdf.h5"
particles = "~/NAUSICAA/0nubb.next.h5"
max_events = 200                  # input events; about two thirds pass the selection
seed = 42
example_events = 5
histogram_bins = 50
max_vector_bytes = 268435456
electron_display_rebin = 20       # display only: 5 us = 3 mm; response vectors retain 250 ns

[overrides]
"gas.pressure_bar" = 15.0
"gas.temperature_K" = 293.15
"geometry.fiducial_length_cm" = 150.0
"drift.field_V_cm" = 300.0
"drift.electron_drift_velocity_mm_us" = 0.6
"drift.electron_lifetime_ms" = 30.0
"drift.electron_transverse_diffusion_mm_sqrtm" = 4.131182235954578     # 1.6 mm sqrt(bar)/sqrt(cm) at 15 bar
"drift.electron_longitudinal_diffusion_mm_sqrtm" = 1.9364916731037083  # 0.75
"drift.ion_drift_velocity_cm_s" = 15.0

[selection]
vertex_min_mm = 50.0
vertex_max_mm = 1450.0
frame_margin_mm = 20.0
gamma_energy_cut_keV = 3.0
frame_track = "primary_and_delta_electrons"

[response]
vh1_card = "config/specs/response/ion_csa/vh1_device_changes_cf20f.toml"
vh1_minimum_samples = 32768
csa_card = "config/specs/response/ion_csa/csa_0p5_enc_4mm.toml"
nonlinear_calibration = "results/ion_csa_nonlinear/v1/calibration.h5"
sipm_card = "config/specs/response/sipm/elm_pitch4mm_3015ps_tau12p5ns_recovered.toml"
asic_card = "config/specs/response/sipm_electronics/readout_v1.toml"

[electronics]            # present-chain acquisition and converter; its own pilot stage
seed = 20261113
accepted_events = 100
example_events = 5
output_subdir = "electronics_100events_efficient"
baseline_ms = 10.0
signal_tail_ms = 5.0
adc_sample_us = 100.0
adc_bits = 12
adc_minimum_V = 0.0
adc_maximum_V = 1.8
adc_input_noise_rms_V = 0.0

[hit_production]         # hit production stage
accepted_events = 100
example_events = 0
output_subdir = "vh1_hit_output_100_cf20f"

[ions]
baseline_ms = 10.0
average_ms = 5.0
nonlinear_below_V = 0.63
max_iterations = 20
convergence_ions = 0.05

[electrons]
subtract_mean_dark = true
rebin_factor = 20

[track_analysis]
ion_graph_mode = "fixed"
ion_voxel_width_mm = 3.0
ion_connection_mm = 7.0
electron_graph_mode = "fixed"
electron_voxel_width_mm = 4.0
electron_connection_mm = 8.0
ion_blob_radius_mm = 7.0
electron_blob_radius_mm = 10.0
example_every = 50
hit_energy_bin_keV = 0.25
hit_energy_max_keV = 200.0
ion_hit_cut_keV = 5.0
electron_hit_cut_keV = 1.0
check_connectivity = true
graph_k = 10
edge_sigma_scale = 6.0
ion_graph_k = 10
electron_graph_k = 20
ion_edge_sigma_scale = 7.5
save_all_track_hits = true

[hit_output]             # as config/readout/bb0nu_vh1_hit_output_100_cf20f.toml, the output to reproduce
ion_hit_cut_keV = 3.0
electron_hit_cut_keV = 1.0
compression_level = 4
chunk_hits = 65536
max_output_bytes = 16777216

[controls]
mode = "none"

[zs_controls]            # reconstruction-controls stage (run_framed_reconstruction.jl)
ion_threshold_step = 5.0
ion_threshold_maximum = 300.0
pe_threshold_step = 0.5
pe_threshold_maximum = 50.0
histogram_bins = 100

# Geometry: fiducial cylinder and the lengths of the regions along the axis,
# from the pads to the SiPM plane. The potentials are in voltages.toml.
schema = "nausicaa.detector_geometry.v1"
fiducial_diameter_cm = 360.0
fiducial_length_cm = 130.0          # drift length, pad-side IFG face to EL entry
ifg_thickness_mm = 10.0             # ion focusing grid, between its two faces
pad_gap_mm = 5.0                    # pad-facing IFG face to the pads
transfer_gap_mm = 10.0              # end of the drift to the EL entry electrode
el_depth_mm = 5.0                   # EL region, entry to exit electrode
guide_length_mm = 100.0             # light guides, EL exit electrode to the SiPM plane
guide_length_policy = "fixed_length"
# Detector coordinates (user, 2026-11-15): z along the drift, z = 0 at the
# TopMetal pad plane, z = fiducial length at the EL entry. An event at z has
# ion drift length z and electron drift length (fiducial length - z). x and y
# are measured from the detector axis. The Geant4 gas volume (ItacaChamber)
# uses the same coordinates, so the generated vertex is used as found.
z_origin = "topmetal_pad_plane"

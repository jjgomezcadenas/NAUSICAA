# eITACA detector (also ITACAe, IE): electrons read by electroluminescence on
# SiPMs in xenon-helium, without ion readout. This index names the cards; each
# holds design values of one subsystem and nothing derived. Values under a
# [documentation] table are not read by the simulation.
# The default set is the variant IE_L1500_D400. A variant card under variants/
# changes values through [overrides]; a run card names the set, optionally a
# variant, and may add its own [overrides]. src/eitaca/EItaca.jl resolves them
# and computes the derived quantities; notes/html/eitaca/index.html shows both.
# User design inputs, 2026-11-17.
schema = "nausicaa.eitaca_set.v1"
name = "eITACA"
date = "2026-11-17"

[cards]   # paths relative to this file
gas = "gas.toml"
geometry = "geometry.toml"
drift = "drift.toml"
voltages = "voltages.toml"
el = "el.toml"
sipm = "sipm.toml"
energy = "energy.toml"
trigger = "trigger.toml"
reconstruction = "reconstruction.toml"
generation = "generation.toml"

changes = [
  "Step 3: exact summed-ion graph threshold, exactly-one-component acceptance, full retained diffusion charge assigned to pad/slice cells.",
  "Retain Petit selected-track x/y energy centre and minimum-z reference; independent pitch, random grid phase and whole-cell extension cover all retained charge.",
  "Store sparse Int64 pad histories, explicit Float32 axes and selectable relative-time direction; final upper edges included.",
  "Step 2: retain Petit per-hit rounding, thermal width formula, three Gaussian draws per ion and dense histogram; explicit Float32 RNG, common W, Int64 charge ledger and saved edges.",
  "Assign bins from saved Float32 edges, include the final upper edge; one adjacent-float cell represents a coincident zero-diffusion axis.",
  "Copied graph and backbone algorithm bodies; Float32 fields, literals, arrays and reductions.",
  "Require explicit finite positive graph cutoff; default kNN; validate single-event Float32 table.",
  "Keep component indices and local induced-graph indexing; copy endpoint values as NamedTuples.",
  "Copy MST graph on trivial return and return typed empty raw paths.",
  "Adapt MC truth path to actual sorted primary IDs; preserve consecutive-cell grouping and time ordering.",
  "Adapt voxelization to energy-only Float32 output; ion conversion is a separate explicit-W function.",
  "Use configurable 3 sigma bin width and 6 sigma edge cutoff at every drift distance.",
  "Rename diffusion metadata fields with units; drift_length_cm stores cm.",
]


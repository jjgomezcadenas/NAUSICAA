electron_drift_velocity_mm_us = 0.49            # from the Kr uniformity map (marked with a dagger in Table 1)
electron_drift_velocity_error_mm_us = 0.05
electron_reduced_transverse_diffusion_um_sqrtbar_sqrtcm = 1094.0
electron_reduced_transverse_diffusion_error_um_sqrtbar_sqrtcm = 157.0
electron_reduced_longitudinal_diffusion_um_sqrtbar_sqrtcm = 1489.0
electron_reduced_longitudinal_diffusion_error_um_sqrtbar_sqrtcm = 81.0
